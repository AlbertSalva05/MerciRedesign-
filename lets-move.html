            <li aria-current="{{ d.current }}" style="border:1px solid {{ d.border }};background:{{ d.bg }};color:{{ d.color }}" class="contact-us__li"><span class="contact-us__span-14">{{ d.day }}</span><span class="contact-us__span-2">08:00 am – 07:00 pm</span></li>
          </sc-for>
        </ul>
        <p class="contact-us__p-4"><span class="contact-us__span-15">Mon – Sun</span><span class="contact-us__span-16">08:00 am – 07:00 pm</span></p>
        <p class="contact-us__p-5">Appointment times available outside normal business hours. Just call!</p>
      </div>
    </div>
  </div>
</section>
<section id="search" aria-labelledby="search-title" data-screen-label="Find your dream home" style="padding:{{ searchPadTop }} clamp(24px,5vw,56px) clamp(96px,11vw,152px)" class="find-your-dream-home__section-2">
  <div class="find-your-dream-home__div">
    <h2 id="search-title" class="find-your-dream-home__h2">Find Your <span data-mark="1" class="find-your-dream-home__span">Dream Home<span aria-hidden="true" style="clip-path:{{ mark1 }}" class="find-your-dream-home__span-2"></span></span></h2>
  </div>
  <form name="listing-search" onsubmit="{{ onSearch }}" novalidate="" class="find-your-dream-home__form">
    <h3 class="find-your-dream-home__h3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search Listings</h3>
    <div class="find-your-dream-home__div-3">
      <sc-for list="{{ selects }}" as="f" hint-placeholder-count="4">
        <div class="find-your-dream-home__div-4">
          <label for="{{ f.id }}" class="find-your-dream-home__label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="{{ f.icon1 }}"></path><path d="{{ f.icon2 }}"></path><path d="{{ f.icon3 }}"></path></svg>{{ f.label }}</label>
          <div class="find-your-dream-home__div-5">
            <x-select id="{{ f.id }}" name="{{ f.name }}" class="find-your-dream-home__select">
              <sc-for list="{{ f.options }}" as="o" hint-placeholder-count="1"><x-option value="{{ o }}">{{ o }}</x-option></sc-for>
            </x-select>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="find-your-dream-home__svg"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
        </div>
      </sc-for>
      <div class="find-your-dream-home__div-4">
        <label for="f-min" class="find-your-dream-home__label-2">Min Price</label>
        <div class="find-your-dream-home__div-5">
          <span aria-hidden="true" class="find-your-dream-home__span-3">$</span>
          <input id="f-min" name="min" inputmode="numeric" autocomplete="off" placeholder="No minimum" aria-describedby="search-msg" class="find-your-dream-home__input">
        </div>
      </div>
      <div class="find-your-dream-home__div-4">
        <label for="f-max" class="find-your-dream-home__label-2">Max Price</label>
        <div class="find-your-dream-home__div-5">
          <span aria-hidden="true" class="find-your-dream-home__span-3">$</span>
          <input id="f-max" name="max" inputmode="numeric" autocomplete="off" placeholder="No maximum" aria-describedby="search-msg" aria-invalid="{{ priceInvalid }}" style="border:1px solid {{ priceBorder }}" class="find-your-dream-home__input-2">
        </div>
      </div>
      <div class="find-your-dream-home__div-4">
        <label for="f-sort" class="find-your-dream-home__label-2">Sort By</label>
        <div class="find-your-dream-home__div-5">
          <x-select id="f-sort" name="sort" class="find-your-dream-home__select">
            <sc-for list="{{ sorts }}" as="o" hint-placeholder-count="1"><x-option value="{{ o }}">{{ o }}</x-option></sc-for>
          </x-select>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="find-your-dream-home__svg"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>
      <div class="find-your-dream-home__div-6">
        <button type="submit" disabled="{{ searchBusy }}" class="find-your-dream-home__button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>{{ searchLabel }}</button>
      </div>
    </div>
    <p id="search-msg" role="status" aria-live="polite" style="color:{{ searchMsgColor }}" class="find-your-dream-home__p">{{ searchMsg }}</p>
  </form>
</section>



</main>

<button type="button" onclick="{{ toTop }}" aria-label="Back to top" tabindex="{{ topTab }}" aria-hidden="{{ topHidden }}" style="bottom:{{ topBottom }};opacity:{{ topOp }};visibility:{{ topVis }};transform:{{ topTf }};transition:opacity 200ms var(--ease), transform 200ms var(--ease), visibility 0s linear {{ topDelay }}" class="app__button-2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg></button>

<sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-modal="true" aria-label="{{ lbLabel }}" onclick="{{ lbBackdrop }}" ontouchstart="{{ lbTouchStart }}" ontouchmove="{{ lbTouchMove }}" ontouchend="{{ lbTouchEnd }}" class="app__div-6">
    <button type="button" data-lb-close="1" onclick="{{ lbClose }}" aria-label="Close photo viewer" class="app__button-3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
    <sc-if value="{{ lbOk }}" hint-placeholder-val="{{ false }}">{{ lbImage }}</sc-if>
    <sc-if value="{{ lbFailed }}" hint-placeholder-val="{{ false }}"><p class="app__p-3">This photo could not be loaded.</p></sc-if>
    <div class="app__div-7">
      <button type="button" onclick="{{ lbPrev }}" aria-label="Previous photo" class="app__button-4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></button>
      <span class="app__span-2">
        <span aria-live="polite" class="app__span-3">{{ lbCount }}</span>
        <span class="app__span-4"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 7l-5 5 5 5"></path><path d="M16 7l5 5-5 5"></path></svg>{{ lbHint }}</span>
      </span>
      <button type="button" onclick="{{ lbNext }}" aria-label="Next photo" class="app__button-4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
    </div>
  </div>
</sc-if>

<sc-if value="{{ showCookie }}" hint-placeholder-val="{{ false }}">

    <button type="button" onclick="{{ acceptCookies }}" class="app__button-5">Accept</button>
  </div>
</sc-if>
</div>
