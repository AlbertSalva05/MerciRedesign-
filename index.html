<section id="about-bio" aria-labelledby="bio-title" data-screen-label="About bio" style="max-width:1280px;margin:0 auto;padding:clamp(72px,9vw,128px) clamp(24px,5vw,56px)">

        <p style="max-width:60ch;color:var(--ink-2);font-size:1.125rem;line-height:1.75;text-wrap:pretty">Marci was a REALTOR, then licensed Broker, in Washington State. Now, she is enjoying the sunshine, and helping clients in Southern Nevada. Having helped buyers and sellers in many markets since 1995, she is a wealth of knowledge.</p>
      </div>
      <figure style="display:flex;margin:0;padding-top:40px;border-top:1px solid var(--line);flex-direction:column;gap:24px">
        <h3 style="display:flex;color:var(--accent);font-size:1rem;font-weight:600;line-height:1.5;letter-spacing:.12em;align-items:center;gap:16px;text-transform:uppercase"><span aria-hidden="true" style="width:32px;height:1px;background:var(--accent)"></span>In Her Words</h3>

          <p style="max-width:52ch;color:var(--ink);font-size:clamp(1.25rem,2vw,1.5rem);font-family:var(--serif);line-height:1.5;font-style:italic;text-wrap:pretty">I enjoy living in the Mountain Falls community and will strive to find you a home that will suit you just as this community does me."</p>
        </blockquote>
